<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Fetch API CRUD - Helységek</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; margin: 20px; }
        .container { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #add8e6; border: none; cursor: pointer; font-weight: bold; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; max-width: 600px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #add8e6; }
        .footer { margin-top: 40px; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>

    <h1>Helységek kezelése (Fetch API)</h1>

    <div class="container">
        <input type="text" id="nev" placeholder="Város neve">
        <input type="text" id="orszag" placeholder="Ország">
        <button onclick="hozzaad()">Hozzáadás</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Város</th>
                <th>Ország</th>
                <th>Művelet</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <div class="footer">
        <a href="index.html" style="text-decoration: none; color: black; font-weight: bold;">⬅ Vissza a főoldalra</a>
    </div>

    <script src="fetch_script.js"></script>
</body>
</html>
